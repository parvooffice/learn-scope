[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnscope"
version = "0.2.0"
description = "Watch a neural network learn, live: a pure-Python engine (NumPy) with a NiceGUI web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "nicegui>=3.0", "plotly>=5.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
learnscope = "learnscope.app:main"

[tool.setuptools]
packages = ["learnscope", "learnscope.doctor", "learnscope.mnist", "learnscope.ui"]
include-package-data = true

[tool.setuptools.package-data]
learnscope = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "E731", "B023", "B905", "UP037", "UP006"]
